[project]
name = "fastapi-practice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mugiwaradevansh", email = "dsppatel.149@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.165.0",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "httpx>=0.28.1",
    "imagekitio>=5.13.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
fastapi-practice = "fastapi_practice:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
